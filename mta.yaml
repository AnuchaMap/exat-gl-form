_schema-version: "3.2"
ID: glsmanagement
version: 0.0.1
modules:
- name: glsmanagement-destination-content
  type: com.sap.application.content
  requires:
  - name: glsmanagement-destination-service
    parameters:
      content-target: true
  - name: glsmanagement_html_repo_host
    parameters:
      service-key:
        name: glsmanagement_html_repo_host-key
  - name: uaa_glsmanagement
    parameters:
      service-key:
        name: uaa_glsmanagement-key
  parameters:
    content:
      subaccount:
        destinations:
        - Name: glsmanagement_glsmanagement_html_repo_host
          ServiceInstanceName: glsmanagement-html5-app-host-service
          ServiceKeyName: glsmanagement_html_repo_host-key
          sap.cloud.service: glsmanagement
        - Authentication: OAuth2UserTokenExchange
          Name: glsmanagement_uaa_glsmanagement
          ServiceInstanceName: glsmanagement-xsuaa-service
          ServiceKeyName: uaa_glsmanagement-key
          sap.cloud.service: glsmanagement
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: glsmanagement-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: glsmanagement_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - glmgtnspworkflowuimodule.zip
      name: glmgtnspworkflowuimodule
      target-path: resources/
- name: glmgtnspworkflowuimodule
  type: html5
  path: workflow-ui-module
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: glsmanagement-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        subaccount:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: glsmanagement-destination-service
    service-plan: lite
- name: glsmanagement_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: glsmanagement-html5-app-host-service
    service-plan: app-host
- name: uaa_glsmanagement
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: glsmanagement-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
